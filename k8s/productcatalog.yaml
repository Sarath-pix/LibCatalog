apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-catalog
  template:
    metadata:
      labels:
        app: library-catalog
    spec:
      containers:
        - name: library-catalog
          image: sarathvenkat07/library-catalog:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: library-catalog-service
spec:
  type: NodePort
  selector:
    app: library-catalog
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
